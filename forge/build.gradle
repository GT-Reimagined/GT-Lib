plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'xyz.wagyourtail.unimined.expect-platform' version '1.0.5'
}

archivesBaseName = "${rootProject.antimatter_archive_base_name}-forge"

minecraft {
    // Change to your preferred mappings
    mappings channel: "parchment", version: "${rootProject.mappings_version}-${rootProject.minecraft_version}"
    // Add your AccessTransformer
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "antimatter.refmap.json"
    config "antimatter.mixins.json"
    config "antimatter-forge.mixins.json"
    config "antimatter.rei.mixins.json"
    debug.verbose = true
    debug.export = true
}

jarJar.enable()

dependencies {
    implementation(expectPlatform.annotationsDep)
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation(project(path: ":tesseract-forge"))
    implementation(project(path: ":tesseract-common"))
    afterEvaluate {
        jarJar(project(path: ":tesseract-forge")){
            jarJar.ranged(it, "[${project(":tesseract-forge").version},)")
            transitive = false
        }
    }

    //MIXIN
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
    //modCompileOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    //modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    implementation fg.deobf("mezz.jei:jei-1.18.2:9.7.2.1001")
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rootProject.rei_version}")
    implementation fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-1.18.2:${rootProject.crafttweaker_version}")
    implementation fg.deobf(include("dev.trinsdar:arrp-forge:0.6.7"))
    implementation fg.deobf(include("dev.trinsdar:terraform-utils-v1:3.1.5"))
    implementation fg.deobf(include("earth.terrarium:botarium-forge-1.18.2:${project.botarium_version}"))
    implementation fg.deobf(include("org.gt-reimagined:structurelib-forge:${project.structurelib_version}-${project.minecraft_version}"))
    implementation fg.deobf(include("com.teamresourceful.resourcefullib:resourcefullib-forge-1.18.2:${project.resourcefullib_version}"))
    implementation fg.deobf(include("io.github.llamalad7:mixinextras-forge:0.2.0-beta.11"))
    implementation(fg.deobf("maven.modrinth:carbon-config:${project.carbon_config_forge_version}"))
    jarJar("maven.modrinth:carbon-config:${project.carbon_config_forge_version}"){
        jarJar.ranged(it, "[1.18.2-1.2.6,)")
    }
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${rootProject.kubejs_version}")
    implementation fg.deobf("curse.maven:the-one-probe-245211:${rootProject.top_forge_file}")
    //include("org.jetbrains.kotlin:kotlin-reflect:${kotlin.coreLibrariesVersion}")
    //include("org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}")
    //include("org.jetbrains.kotlin:kotlin-stdlib-common:${kotlin.coreLibrariesVersion}")
}

Dependency include(Object dep){
    dependencies.jarJar(dep){
        jarJar.ranged(it, "[${it.version},)")
    }
}

tasks.withType(JavaCompile) {
    source(project(":antimatter-common").sourceSets.main.allSource)
    /*expectPlatform.insertAgent(it, "forge", ["xyz/wagyourtail/unimined/expect/annotation/Environment": "net/minecraftforge/api/distmarker/OnlyIn",
                                             "xyz/wagyourtail/unimined/expect/annotation/Environment\$EnvType": "net/minecraftforge/api/distmarker/Dist",
                                             "xyz/wagyourtail/unimined/expect/annotation/Environment\$EnvType.SERVER": "DEDICATED_SERVER",])*/
}

processResources {
    from project(":antimatter-common").sourceSets.main.resources
    inputs.property "version", project.mod_version

    exclude("antimatter.accesswidener")
    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

sourcesJar {
    from(project(':antimatter-common').sourceSets.main.allSource)
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier.set("")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "Trinsdar",
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : "Trinsdar",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
    archiveClassifier.set "thin"
}

publishing {
    publications {
        mavenJava(org.gradle.api.publish.maven.MavenPublication) {
            artifactId = project.name
            from components.java
            jarJar.component(it)
        }
    }
    repositories {
        def isCI = System.getenv("GITHUB_ACTION")
        def isRELEASE = System.getenv("GITHUB_RELEASE")
        if (isCI && isRELEASE) {
            maven {
                url = "https://repo.repsy.io/mvn/trinsdar/gregtech-intergalactical/"
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_PASSWORD")
                }
            }
        } else {
            mavenLocal()
        }
    }
}
