import xyz.wagyourtail.unimined.expect.task.ExpectPlatformJar
plugins {
    id "net.neoforged.moddev.legacyforge"
    id 'xyz.wagyourtail.unimined.expect-platform' version '1.0.5'
}

archivesBaseName = "${project.antimatter_archive_base_name}"

legacyForge {
    version = "${project.minecraft_version}-${project.forge_version}"
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.mappings_version
    }
    runs {
        client {
            client()

        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def mainRefmapFile;

mixin {
    mainRefmapFile = add sourceSets.main, "antimatter.refmap.json"
    config "antimatter.mixins.json"
    config "antimatter.rei.mixins.json"
}


dependencies {
    implementation(expectPlatform.annotationsDep)
    implementation(project(":tesseract-forge"))
    compileOnly(project(":tesseract-common"))
    jarJar("org.gt-reimagined:tesseract-forge:0.2.4.1-1.18.2")

    //MIXIN
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
    implementation("org.jetbrains:annotations:26.0.1")
    //modCompileOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    //modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    modImplementation("mezz.jei:jei-1.18.2:9.7.2.1001")
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}")
    modCompileOnly("me.shedaniel.cloth:cloth-config-forge:6.5.133")
    modImplementation("com.blamejared.crafttweaker:CraftTweaker-forge-1.18.2:${project.crafttweaker_version}")
    modImplementation(jarJar("dev.trinsdar:arrp-forge:0.6.7.1"))
    modImplementation(jarJar("dev.trinsdar:terraform-utils-v1:3.1.5"))
    modImplementation(jarJar("org.gt-reimagined:structurelib-forge:${project.structurelib_version}-${project.minecraft_version}"))
    modImplementation(jarJar("com.teamresourceful.resourcefullib:resourcefullib-forge-1.18.2:${project.resourcefullib_version}"))
    modImplementation("maven.modrinth:carbon-config:${project.carbon_config_forge_version}")
    jarJar("maven.modrinth:carbon-config:${project.carbon_config_forge_version}"){
        version {
            prefer(project.carbon_config_forge_version)
        }
    }
    modImplementation("dev.latvian.mods:kubejs-forge:${project.kubejs_version}")
    modImplementation("dev.latvian.mods:rhino-forge:${project.rhino_version}")
    modImplementation("dev.architectury:architectury-forge:${project.architectury_version}")
    modImplementation("curse.maven:the-one-probe-245211:${project.top_forge_file}")
    modImplementation("curse.maven:curios-309927:4985315")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:0.5.1.i-435:all")
    modImplementation("curse.maven:jade-324717:5079263")
    //include("org.jetbrains.kotlin:kotlin-reflect:${kotlin.coreLibrariesVersion}")
    //include("org.jetbrains.kotlin:kotlin-stdlib:${kotlin.coreLibrariesVersion}")
    //include("org.jetbrains.kotlin:kotlin-stdlib-common:${kotlin.coreLibrariesVersion}")
}


processResources {
    inputs.property "version", project.mod_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.mod_version
    }
}

jar{
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : "GT-Reimagined",
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : "GT-Reimagined",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs" : "antimatter.mixins.json,antimatter.rei.mixins.json"
        ])
    }
}

publishing {
    publications {
        mavenJava(org.gradle.api.publish.maven.MavenPublication) {
            artifactId = project.name
            from components.java
        }
    }
    repositories {
        def isCI = System.getenv("CI")
        def isRELEASE = System.getenv("GITHUB_RELEASE")
        if (isRELEASE){
            maven {
                name = "GTMaven"
                url = "https://repo.repsy.io/mvn/trinsdar/gregtech-intergalactical/"
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_PASSWORD")
                }
            }
        } else if (isCI) {
            maven {
                url System.getenv("local_maven_url")
            }
        } else {
            mavenLocal()
        }
    }
}
